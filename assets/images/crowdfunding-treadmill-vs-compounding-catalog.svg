    <text transform="matrix(1 0 0 1 114 375)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#f1f5f9"><tspan x="0" y="0">The Day 31 Revenue Cliff</tspan></text>
    <text transform="matrix(1 0 0 1 114 393)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="12" fill="#94a3b8"><tspan x="0" y="0">Once the kickstarter campagn is concluded and you collect your payments, </tspan><tspan x="0" y="14.4">revenue drops instantly to $0.00/month. There is no recurring revenue stream.</tspan></text>
